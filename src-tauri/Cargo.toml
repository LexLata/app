[package]
name = "lexlata"
version = "0.1.0"
description = "Desktop-App zur Darstellung und Annotation deutscher Rechtstexte"
authors = ["LexLata <lexlata@mailbox.org>"]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LexLata/app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lexlata_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
# Vorübergehend festgesetzt: 2.6.2 kompiliert unter Linux mit rust-ini 0.21.3 nicht.
# Nach Veröffentlichung der Korrektur aufheben: tauri-apps/plugins-workspace#3711.
tauri-plugin-deep-link = "=2.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
terminal_size = "0.4"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tokio = { version = "1", features = ["time", "sync"] }
tauri-plugin-opener = "2"

# Nur auf macOS: direkter Zugriff auf AppKit (siehe fenster.rs) sowie
# WKWebView (native JS-Auswertung im Landesrecht-Import, siehe
# landesrecht_import/mac.rs). Diese Crates sind ohnehin schon transitiv
# über Tauri selbst im Abhängigkeitsbaum vorhanden, werden hier nur direkt
# nutzbar gemacht.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"

# Nur auf Linux: direkter Zugriff auf webkit2gtk für native JS-Auswertung im
# WebView (siehe landesrecht_import/linux.rs). Feature v2_40 wird für
# evaluate_javascript benötigt (siehe Kommentar dort).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
gtk = "0.18"

# Weiterleitung zweiter Starts nur auf Windows/Linux; macOS bleibt unverändert.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "=2.5.1", features = ["deep-link"] }

# Nur auf Windows: direkter Zugriff auf ICoreWebView2 für native JS-Auswertung
# im WebView (siehe landesrecht_import/windows.rs).
[target.'cfg(target_os = "windows")'.dependencies]
# Dieselben Typversionen wie Tauri/Wry: Controller und Callback werden direkt
# miteinander verwendet und dürfen nicht aus unterschiedlichen Versionen stammen.
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Console"] }

# App-Update nur am Desktop; genutzt wird ausschließlich die Rust-API
# (siehe commands/app_update.rs), keine Freigabe für das JS-Plugin.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
# Tatsächliche IPC-Commandgrenzen ohne Desktop-WebView prüfen.
tauri = { version = "2", features = ["test"] }

[profile.dev]
debug = 1

[lints.clippy]
undocumented_unsafe_blocks = "deny"

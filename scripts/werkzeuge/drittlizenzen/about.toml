# Konfiguration für cargo-about (Aufruf über npm run drittlizenzen).
# Erfasst nur Laufzeit-Abhängigkeiten der App auf den Zielplattformen.
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
accepted = [
  # Eigene Lizenz (App-Crate selbst; wird im Ergebnis ausgelassen).
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
  "CDLA-Permissive-2.0",
]
